[project]
name = "autoclipper"
version = "0.1.0"
description = "Local app that turns long videos into captioned 9:16 shorts with English and Hindi voice-over"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.70",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2026.6",
]

[project.scripts]
autoclipper = "autoclipper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: needs real models or network (skipped by default; run with `uv run pytest -m slow`)",
    "hyperframes: renders with the real HyperFrames CLI (needs Node 22 + hyperframes; also marked slow; run with `uv run pytest -m hyperframes`)",
    "demucs: runs the real Demucs install (separation.python; also marked slow; skipped when it is missing)",
    "system_font: burns text with libass and needs at least one system font (skipped when fontconfig lists none; CI installs fonts-noto-core)",
    "real_clients: lets the test use pipeline._make_llm/_make_voicebox/_make_transcriber (blocked by conftest otherwise)",
]

[tool.hatch.build.targets.wheel]
packages = ["autoclipper"]
